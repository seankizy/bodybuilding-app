<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workout" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/fonts/Inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/CormorantGaramond.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/marble/nero.webp" as="image" />
    <title>Workout Journal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      @font-face { font-family: Inter; src: url(/fonts/Inter.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
      @font-face { font-family: "Cormorant Garamond"; src: url(/fonts/CormorantGaramond.woff2) format("woff2"); font-weight: 300 700; font-display: swap; }
      html { background: #0b0b0b; }
      html, body, #root { height: 100%; }
      body { overscroll-behavior: none; background: transparent; color: #EEE9E0; font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; font-size: 15px; -webkit-font-smoothing: antialiased; }
      /* KAP marbles ground: Nero Marquina, zoomed, under a dark veil. Fixed behind the whole app. */
      body::before { content: ""; position: fixed; inset: -12px; z-index: -2; background: #0b0b0b url(/marble/nero.webp) 30% 70% / 240%; filter: blur(3px) saturate(0.8); pointer-events: none; }
      body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(6,6,6,0.55), rgba(6,6,6,0.68)); pointer-events: none; }
      input, textarea, select, button { font-family: inherit; }
      input, textarea { font-variant-numeric: tabular-nums; }
      button { border: 1px solid rgba(255,255,255,0.08); color: inherit; }
      input::placeholder, textarea::placeholder { color: #8c877f; }
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=date]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
